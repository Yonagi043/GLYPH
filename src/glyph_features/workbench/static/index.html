<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#171a17">
  <title>GLYPH 统一研究工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">跳到工作区</a>
  <div class="app-shell">
    <aside class="side-rail" id="side-rail">
      <header class="brand-lockup">
        <a href="#overview" class="brand" aria-label="GLYPH 总览">
          <span class="brand-mark" aria-hidden="true">字</span>
          <span><strong>GLYPH</strong><small>联合研究系统</small></span>
        </a>
        <span class="environment-label">SYNTHETIC / DEMO</span>
      </header>

      <nav class="primary-nav" aria-label="全局导航">
        <button type="button" data-view="overview" class="active"><span>01</span>总览</button>
        <button type="button" data-view="assets"><span>02</span>来源与资产</button>
        <button type="button" data-view="vision"><span>03</span>视觉测量</button>
        <button type="button" data-view="experiment"><span>04</span>跨文化实验</button>
        <button type="button" data-view="social"><span>05</span>文化叙事</button>
        <button type="button" data-view="han_style"><span>06</span>汉字书体</button>
        <button type="button" data-view="analysis"><span>07</span>联合分析</button>
        <button type="button" data-view="audit"><span>08</span>审计与发布</button>
      </nav>

      <footer class="rail-footer">
        <button type="button" class="health-button" data-action="show-health">
          <span class="health-pulse" aria-hidden="true"></span>
          <span><b id="rail-health">检查中</b><small>本机系统健康</small></span>
        </button>
        <p>v0.1.0 · 127.0.0.1</p>
      </footer>
    </aside>

    <main id="workspace" class="workspace" tabindex="-1">
      <header class="topbar">
        <button type="button" class="menu-button" id="menu-button" aria-label="打开导航" aria-expanded="false">菜单</button>
        <div class="breadcrumb">
          <span>GLYPH</span><i aria-hidden="true">/</i><strong id="view-crumb">总览</strong>
        </div>
        <div class="topbar-actions">
          <span class="mode-chip"><i aria-hidden="true"></i>只读证据视图</span>
          <button type="button" class="icon-button" data-action="refresh" aria-label="刷新当前视图" title="刷新">↻</button>
        </div>
      </header>

      <div id="app" class="view-root" aria-live="polite" aria-busy="true">
        <section class="loading-state">
          <span class="loading-rule"></span>
          <p>正在读取本机目录...</p>
        </section>
      </div>
    </main>
  </div>

  <aside class="inspector" id="inspector" role="dialog" aria-modal="true" aria-labelledby="inspector-title" aria-hidden="true" tabindex="-1" inert>
    <header>
      <div><span class="eyebrow">证据下钻</span><h2 id="inspector-title">实体详情</h2></div>
      <button type="button" class="icon-button" data-action="close-inspector" aria-label="关闭详情" title="关闭">×</button>
    </header>
    <div id="inspector-content" class="inspector-content"></div>
  </aside>
  <button type="button" class="scrim" id="scrim" data-action="close-overlays" aria-label="关闭浮层" tabindex="-1"></button>

  <dialog class="confirmation-dialog" id="confirmation-dialog" aria-labelledby="confirmation-title" aria-describedby="confirmation-target confirmation-description">
    <form id="confirmation-form">
      <header>
        <span class="eyebrow">RESTRICTED LOCAL ACTION</span>
        <h2 id="confirmation-title">确认操作</h2>
      </header>
      <dl class="confirmation-details">
        <div><dt>目标</dt><dd id="confirmation-target"></dd></div>
        <div><dt>影响</dt><dd id="confirmation-description"></dd></div>
      </dl>
      <label for="confirmation-input">输入 <code id="confirmation-phrase"></code> 以继续</label>
      <input id="confirmation-input" name="confirmation" type="text" autocomplete="off" spellcheck="false">
      <p class="confirmation-error" id="confirmation-error" aria-live="polite"></p>
      <footer>
        <button class="button" id="confirmation-cancel" type="button">取消</button>
        <button class="button danger" id="confirmation-submit" type="submit" disabled>确认并执行</button>
      </footer>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="assertive"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
