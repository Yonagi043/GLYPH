<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>GLYPH Cross-cultural Visual Study</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="GLYPH home">GLYPH</a>
    <div class="header-status">
      <span id="lock-badge" class="lock-badge">SYNTHETIC ONLY</span>
      <label class="language-control" for="language-select">
        <span id="language-label">语言</span>
        <select id="language-select" aria-label="Questionnaire language">
          <option value="zh-Hans">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </label>
    </div>
  </header>

  <main class="study-shell">
    <aside class="study-rail" aria-label="Study progress">
      <p id="study-code" class="study-code">WP1 / v1.0.0</p>
      <ol id="stage-list" class="stage-list">
        <li data-stage="intro" class="active"><span>01</span><b id="stage-intro">信息</b></li>
        <li data-stage="setup"><span>02</span><b id="stage-setup">背景</b></li>
        <li data-stage="trial"><span>03</span><b id="stage-trial">评价</b></li>
        <li data-stage="complete"><span>04</span><b id="stage-complete">完成</b></li>
      </ol>
      <div class="gate-status">
        <span class="status-dot" aria-hidden="true"></span>
        <p id="gate-copy">真实收集已锁定</p>
      </div>
    </aside>

    <section class="study-panel" aria-live="polite">
      <div class="panel-meta">
        <span id="translation-state">翻译草案 / 未经人工审核</span>
        <span id="progress-text">0 / 8</span>
      </div>
      <div id="app" class="screen">
        <p class="loading">Loading...</p>
      </div>
    </section>
  </main>

  <div id="live-region" class="sr-only" aria-live="assertive"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
