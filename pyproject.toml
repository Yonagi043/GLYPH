[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "glyph-features"
version = "1.2.0"
description = "Reproducible GLYPH visual feature extraction protocol"
requires-python = ">=3.11,<3.12"
dependencies = ["Pillow==11.3.0", "numpy==2.0.2", "scipy==1.14.1", "scikit-image==0.24.0", "fonttools==4.55.0", "uharfbuzz==0.43.0", "jsonschema==4.25.1", "referencing==0.37.0"]
[project.optional-dependencies]
dev = ["pytest==8.4.1"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
